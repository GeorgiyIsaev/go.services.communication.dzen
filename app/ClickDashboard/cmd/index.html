<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика кликов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .controls { margin-bottom: 20px; }
        .controls label { margin-right: 10px; }
        .controls input { width: 80px; margin-right: 10px; }
        .controls .hint { color: #888; margin-left: 10px; font-size: 13px; }
        table { border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: center; }
        th { background-color: #f4f4f4; }
        .author-col { text-align: left; }
        .no-data { color: #999; margin-top: 20px; }
        .error { color: #b00; margin-top: 12px; }
        .warn  { color: #a60; margin-top: 12px; }
    </style>
</head>
<body>
<h1>Аналитика кликов</h1>
<div class="controls">
    <label for="daysInput">Количество дней:</label>
    <input type="number" id="daysInput" value="5" min="1">
    <button id="refreshBtn">Обновить данные</button>
    <span class="hint" id="limitHint"></span>
</div>
<div id="tableContainer"></div>
<div id="errorMsg" class="error"></div>
<div id="warnMsg" class="warn"></div>

<script>
    // Страница общается только со своим бэкендом (ClickDashboard),
    // который агрегирует данные из StorageGateway.
    // URL — относительный, чтобы работало и локально, и в докере, и за reverse-proxy.
    const API_BASE = '';

    let maxDays = 30; // перезапишется после GET /config

    const daysInput = document.getElementById('daysInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const errorMsg = document.getElementById('errorMsg');
    const warnMsg = document.getElementById('warnMsg');
    const tableContainer = document.getElementById('tableContainer');
    const limitHint = document.getElementById('limitHint');

    // Подтягиваем лимит с бэкенда. Если не получилось — оставляем значение по умолчанию.
    async function loadConfig() {
        try {
            const r = await fetch(`${API_BASE}/config`);
            if (r.ok) {
                const cfg = await r.json();
                if (cfg.max_days && cfg.max_days > 0) {
                    maxDays = cfg.max_days;
                }
            }
        } catch (_) { /* не критично */ }
        daysInput.max = String(maxDays);
        limitHint.textContent = `(максимум: ${maxDays})`;
    }

    async function loadStats() {
        errorMsg.textContent = '';
        warnMsg.textContent = '';

        let days = parseInt(daysInput.value, 10);
        if (!days || days < 1) {
            errorMsg.textContent = 'Введите положительное число дней.';
            return;
        }

        // Мягко предупреждаем и подрезаем до лимита — чтобы не гонять 400-ку.
        if (days > maxDays) {
            warnMsg.textContent = `Максимум ${maxDays} дней. Показываем за ${maxDays}.`;
            days = maxDays;
            daysInput.value = String(maxDays);
        }

        try {
            const r = await fetch(`${API_BASE}/stats?days=${encodeURIComponent(days)}`);
            if (!r.ok) {
                // Ожидаем формат {"error": "..."}
                let msg = `Ошибка ${r.status}`;
                try {
                    const body = await r.json();
                    if (body && body.error) msg = body.error;
                } catch (_) { /* ignore */ }
                throw new Error(msg);
            }
            const data = await r.json();
            buildTable(data);
        } catch (err) {
            errorMsg.textContent = 'Ошибка: ' + err.message;
            tableContainer.innerHTML = '';
        }
    }

    function buildTable(data) {
        if (!data.dates || data.dates.length === 0) {
            tableContainer.innerHTML = '<div class="no-data">Нет данных за указанный период.</div>';
            return;
        }

        let html = '<table>';
        html += '<thead><tr><th class="author-col">Автор</th>';
        data.dates.forEach(date => { html += `<th>${date}</th>`; });
        html += '</tr></thead><tbody>';

        data.authors.forEach(a => {
            // Красивое имя: если first/last — "unknown", показываем ID.
            let name = `${a.first_name} ${a.last_name}`.trim();
            if (!name || name.toLowerCase() === 'unknown unknown') {
                name = `Автор #${a.id}`;
            }
            html += '<tr>';
            html += `<td class="author-col" title="${a.email}">${name}</td>`;
            a.clicks.forEach(c => { html += `<td>${c}</td>`; });
            html += '</tr>';
        });
        html += '</tbody></table>';

        tableContainer.innerHTML = html;
    }

    refreshBtn.addEventListener('click', loadStats);
    daysInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadStats(); });

    document.addEventListener('DOMContentLoaded', async () => {
        await loadConfig();
        await loadStats();
    });
</script>
</body>
</html>
