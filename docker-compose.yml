# docker-compose.yml
name: communication_services

services:

  click-counter:
    build:
      context: .
      dockerfile: app/ClickCounter/Dockerfile
    container_name: click_counter
    depends_on:
      storage-gateway:
        condition: service_healthy       # ждём HTTP /healthz
      kafka1:
        condition: service_healthy       # ждём, пока Kafka принимает запросы
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    environment:
      PORT_CLICK_COUNTER: 8080

      # INTERNAL-порты kafka (19092/19093/19094), НЕ внешние 9092/9093/9094!
      # Изнутри docker-сети клиент должен идти на INTERNAL listener.
      KAFKA_BROKERS: "kafka1:19092,kafka2:19093,kafka3:19094"
      KAFKA_TOPIC: clicks

      # HTTP (не gRPC!) к StorageGateway — порт 8084, не 9084
      STORAGE_GATEWAY_URL: http://storage-gateway:8084
      STORAGE_GATEWAY_TIMEOUT: "10s"

      MAX_RETRIES: 5
      RETRY_DELAY: "1m"
      LONG_RETRY_DELAY: "30m"
      MAX_FLUSH_DURATION: "2h"
      SCHEDULER_HOURS: "0,1"
      SCHEDULER_MINUTE: 5
    ports:
      - "8080:8080"
    networks:
      - kafka-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  click-dashboard:
    build:
      context: .
      dockerfile: app/ClickDashboard/Dockerfile
    container_name: click_dashboard
    depends_on:
      storage-gateway:
        condition: service_healthy         # ждем healthy от storage-gateway
    environment:
      PORT_CLICK_DASHBOARD: 8085
      STORAGE_GATEWAY_ADDR: storage-gateway:9084
      STORAGE_GATEWAY_TIMEOUT: "10s"
      MAX_DAYS: 30
      REFRESH_INTERVAL: "5m"
    ports:
      - "8085:8085"
    networks:
      - kafka-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8085/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  storage-gateway:
    build:
      context: .
      dockerfile: app/StorageGateway/Dockerfile
    container_name: storage_gateway
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db                          # <-- имя сервиса, НЕ localhost
      DB_PORT: 5432                        # порт который открывается в докере, а не пробрасывается наружу
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT_CLICK_STORAGE: 8084
      GRPC_PORT_CLICK_STORAGE: 9084
      MIGRATIONS_PATH: file:///app/migrations
    ports:
      - "8084:8084"    # HTTP
      - "9084:9084"    # gRPC
    networks:
      - kafka-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  kafka1:
    image: confluentinc/cp-kafka:latest
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9099,2@kafka2:9099,3@kafka3:9099'
      KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9099'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka1:19092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    networks:
      - kafka-net
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka2:
    image: confluentinc/cp-kafka:latest
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9099,2@kafka2:9099,3@kafka3:9099'
      KAFKA_LISTENERS: 'INTERNAL://:19093,EXTERNAL://:9093,CONTROLLER://:9099'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka2:19093,EXTERNAL://localhost:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    networks:
      - kafka-net
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka3:
    image: confluentinc/cp-kafka:latest
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9099,2@kafka2:9099,3@kafka3:9099'
      KAFKA_LISTENERS: 'INTERNAL://:19094,EXTERNAL://:9094,CONTROLLER://:9099'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka3:19094,EXTERNAL://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    networks:
      - kafka-net
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9094 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Опционально: веб-интерфейс для Kafka
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8182:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: 'kafka1:19092,kafka2:19093,kafka3:19094'
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-net
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: postgres:15-alpine
    container_name: click_analytics_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kafka-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d click_analytics" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  postgres_data: